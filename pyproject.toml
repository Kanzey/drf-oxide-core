[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "fast-drf-core"
description = "Rust core for fast-drf: compiled Django REST framework serializers"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.8,<2"]

[tool.maturin]
python-source = "python"
module-name = "fast_drf_core._fast_drf_core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
